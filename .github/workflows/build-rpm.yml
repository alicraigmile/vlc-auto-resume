name: Build RPM and DEB Packages

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-rpm:
    runs-on: ubuntu-latest
    container:
      image: fedora:44
    env:
      LANG: C.UTF-8
      LC_ALL: C.UTF-8

    steps:
      - name: Install RPM build tools
        run: dnf install -y rpm-build rpmdevtools rpmlint git groff lua

      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Extract version from tag or spec
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
            sed -i "s/^Version:.*/Version:        ${VERSION}/" vlc-auto-resume.spec
          else
            VERSION=$(rpmspec -q --qf "%{version}\n" vlc-auto-resume.spec | head -n1)
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Set up rpmbuild tree and source tarball
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          rpmdev-setuptree
          git archive --format=tar.gz \
            --prefix="vlc-auto-resume-${{ steps.meta.outputs.version }}/" \
            -o ~/rpmbuild/SOURCES/vlc-auto-resume-${{ steps.meta.outputs.version }}.tar.gz \
            HEAD

      - name: Build RPM and SRPM
        run: rpmbuild -ba vlc-auto-resume.spec

      - name: Lint RPMs
        run: rpmlint vlc-auto-resume.spec ~/rpmbuild/RPMS/noarch/*.rpm ~/rpmbuild/SRPMS/*.rpm

      - name: Upload build artifacts
        uses: actions/upload-artifact@v5
        with:
          name: vlc-auto-resume-rpms
          path: |
            ~/rpmbuild/RPMS/noarch/*.rpm
            ~/rpmbuild/SRPMS/*.rpm

      - name: Attach RPMs to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            ~/rpmbuild/RPMS/noarch/*.rpm
            ~/rpmbuild/SRPMS/*.rpm

  build-deb:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Determine version
        id: meta
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF#refs/tags/v}"
          else
            VERSION=$(grep -E '^Version:' vlc-auto-resume.spec | awk '{print $2}')
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"

      - name: Build .deb with nFPM
        env:
          VERSION: ${{ steps.meta.outputs.version }}
        run: |
          echo 'deb [trusted=yes] https://repo.goreleaser.com/apt/ /' | sudo tee /etc/apt/sources.list.d/goreleaser.list
          sudo apt-get update
          sudo apt-get install -y nfpm
          nfpm package --packager deb

      - name: Attach .deb to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: vlc-auto-resume_*.deb
